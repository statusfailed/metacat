[package]
name = "metacat-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
hexpr = { workspace = true }
open-hypergraphs = { workspace = true }
thiserror = { workspace = true }
metacat = { path = "../metacat" }

anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.8"
colored = "3.0.0"
open-hypergraphs-dot = { version = "0.2.3", features = ["svg"] }

[[bin]]
name = "metacat"
path = "src/main.rs"
