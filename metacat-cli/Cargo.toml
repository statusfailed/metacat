[package]
name = "metacat-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
hexpr = { workspace = true }
open-hypergraphs = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0.100"
metacat = { version = "0.1.0", path = "../metacat" }
clap = { version = "4.5.54", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.8"

[[bin]]
name = "metacat"
path = "src/main.rs"
